name: CI

on:
    push:
        branches:
            - master
            - github-actions
            - ci
            - develop
            - release
            - "release/**"
        tags:
            - "v*"
    pull_request:
        branches:
            - master
            - develop
            - release
            - "release/**"

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref_name != 'release' && !startsWith(github.ref_name, 'release/') }}

jobs:
    binary-metadata:
        name: Binary package metadata
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            package-ref: ${{ steps.metadata.outputs.package-ref }}
            windows: ${{ steps.metadata.outputs.windows }}
            macos: ${{ steps.metadata.outputs.macos }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - name: Test binary packaging and publishing rules
              run: python .github/tests/test_binary_release.py
            - id: metadata
              name: Check dependency pin and package version
              run: python .github/scripts/binary_release.py metadata

    linux:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                PHP_VERSION:
                    - "8.3"
                    - "8.4"
                    - "8.5"
                COVERAGE: ["true", "false"]
        steps:
            - uses: actions/checkout@v7
            - name: I am tired of writing this shit in YAML and learning a new DSL for every CI service so I'm putting everything in a FSCKING BASH SCRIPT
              env:
                  PHP_VERSION: ${{ matrix.PHP_VERSION }}
                  COVERAGE: ${{ matrix.COVERAGE }}
              run: bash ./.github/scripts/linux.sh
            - name: Coveralls
              if: matrix.COVERAGE == 'true'
              uses: coverallsapp/github-action@v2
              with:
                  file: coverage.info
                  format: lcov
                  flag-name: php-${{ matrix.PHP_VERSION }}
                  parallel: true

    docker:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                PHP_VERSION:
                    - "8.3"
                    - "8.4"
                    - "8.5"
                DOCKER_NAME:
                    - "alpine"
                    - "debian"
        steps:
            - uses: actions/checkout@v7
            - name: I am tired of writing this shit in YAML and learning a new DSL for every CI service so I am putting everything in a FSCKING BASH SCRIPT
              env:
                  PHP_VERSION: ${{ matrix.PHP_VERSION }}
                  DOCKER_NAME: ${{ matrix.DOCKER_NAME }}
              run: bash ./.github/scripts/docker.sh

    docker-fedora:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - name: I am tired of writing this shit in YAML and learning a new DSL for every CI service so I am putting everything in a FSCKING BASH SCRIPT
              env:
                  DOCKER_NAME: fedora
                  TEST_PHP_EXECUTABLE: /usr/bin/php
              run: bash ./.github/scripts/docker.sh

    osx:
        runs-on: macos-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                PHP_VERSION:
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            - uses: actions/checkout@v7
            - name: I am tired of writing this shit in YAML and learning a new DSL for every CI service so I'm putting everything in a FSCKING BASH SCRIPT
              env:
                  PHP_VERSION: ${{ matrix.PHP_VERSION }}
              run: bash ./.github/scripts/osx.sh

    windows:
        name: "windows (PHP ${{ matrix.php }}, ${{ matrix.ts }}, x64)"
        runs-on: windows-2022
        timeout-minutes: 20
        needs: binary-metadata
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.binary-metadata.outputs.windows) }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Cache libmustache SDK downloads
              uses: actions/cache@v5
              with:
                  path: ${{ runner.temp }}/libmustache-downloads
                  key: libmustache-sdk-${{ matrix.sdk }}-${{ hashFiles('.github/libmustache-sdk.json') }}

            - name: Verify and extract libmustache SDK
              shell: pwsh
              env:
                  LIBMUSTACHE_SDK: ${{ matrix.sdk }}
              run: >-
                  python .github/scripts/binary_release.py sdk "$env:LIBMUSTACHE_SDK"
                  "$env:RUNNER_TEMP/libmustache-downloads" "$env:RUNNER_TEMP/libmustache-sdk"

            - name: Build and test extension
              uses: php/php-windows-builder/extension@36b2fc0672ba93bfa75bdd393edf2ef652961b4a
              env:
                  TEST_PHP_JUNIT: ${{ runner.temp }}/phpt-junit.xml
              with:
                  # The builder uses the checkout; this ref names the PIE package.
                  extension-ref: ${{ needs.binary-metadata.outputs.package-ref }}
                  php-version: ${{ matrix.php }}
                  arch: x64
                  ts: ${{ matrix.ts }}
                  args: --enable-mustache --with-libmustache="${{ runner.temp }}/libmustache-sdk"

            - name: Upload Windows test diagnostics
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: phpt-windows-${{ matrix.php }}-${{ matrix.ts }}-x64
                  path: |
                      ${{ runner.temp }}/phpt-junit.xml
                      build/**/tests/**/*.diff
                      build/**/tests/**/*.log
                  if-no-files-found: ignore

    macos-binaries:
        name: "macOS binary (PHP ${{ matrix.php }}, ${{ matrix.ts }}, arm64)"
        runs-on: macos-15
        timeout-minutes: 20
        needs: binary-metadata
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.binary-metadata.outputs.macos) }}
        env:
            MACOSX_DEPLOYMENT_TARGET: "15.0"
            PHP_VERSION: ${{ matrix.php }}
            PHP_THREAD_SAFETY: ${{ matrix.ts }}
            PACKAGE_REF: ${{ needs.binary-metadata.outputs.package-ref }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Cache libmustache SDK downloads
              uses: actions/cache@v5
              with:
                  path: ${{ runner.temp }}/libmustache-downloads
                  key: libmustache-sdk-macos-aarch64-static-${{ hashFiles('.github/libmustache-sdk.json') }}

            - name: Verify and extract libmustache SDK
              run: >-
                  python .github/scripts/binary_release.py sdk macos-aarch64-static
                  "$RUNNER_TEMP/libmustache-downloads" "$RUNNER_TEMP/libmustache-sdk"

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  php-version: ${{ matrix.php }}
              env:
                  phpts: ${{ matrix.ts }}

            - name: Build, test, and package macOS extension
              id: package
              run: bash .github/scripts/macos-binary.sh

            - name: Upload macOS package
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.package.outputs.package }}
                  path: artifacts/${{ steps.package.outputs.package }}
                  if-no-files-found: error

            - name: Upload macOS test diagnostics
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: phpt-macos-${{ matrix.php }}-${{ matrix.ts }}-arm64
                  path: |
                      ${{ runner.temp }}/phpt-junit.xml
                      ${{ runner.temp }}/phpt-results.txt
                      tests/**/*.diff
                      tests/**/*.log
                  if-no-files-found: ignore

    pie:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            attestations: read
            contents: read
        steps:
            - uses: actions/checkout@v7

            - name: Install and load with PIE
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bash ./.github/scripts/pie.sh

    nix-matrix:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - uses: actions/checkout@v7
            - uses: cachix/install-nix-action@v31
            - name: Restore and save Nix store
              uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
              with:
                  primary-key: nix-${{ runner.os }}-${{ runner.arch }}-matrix-${{ hashFiles('**/*.nix', '**/flake.lock') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-matrix-
            - id: set-matrix
              name: Generate Nix Matrix
              run: |
                  set -Eeu
                  matrix="$(nix eval --json '.#githubActions.matrix')"
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    nix:
        name: "nix (${{ matrix.name }})"
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        needs: nix-matrix
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v7

            - uses: cachix/install-nix-action@v31

            - name: Restore and save Nix store
              uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
              with:
                  primary-key: nix-${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.name }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.name }}-

            - name: Use nix-phps Cache
              uses: cachix/cachix-action@v17
              with:
                  name: fossar

            - run: nix build -L ".#${{ matrix.attr }}"

            - run: find -L result*; cp result-coverage/coverage.info coverage.info || true

            - name: Upload coverage reports to Codecov
              if: hashFiles('coverage.info') != ''
              uses: codecov/codecov-action@v7
              continue-on-error: true
              with:
                  files: coverage.info
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: jbboehr/php-mustache

            - name: Coveralls
              if: hashFiles('coverage.info') != ''
              uses: coverallsapp/github-action@v2
              continue-on-error: true
              with:
                  file: coverage.info
                  format: lcov
                  flag-name: ${{ matrix.name }}
                  parallel: true

    binary-validation:
        name: Validate complete PIE package matrix
        needs: [binary-metadata, windows, macos-binaries]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        env:
            PACKAGE_REF: ${{ needs.binary-metadata.outputs.package-ref }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Download tested release packages
              uses: actions/download-artifact@v8
              with:
                  pattern: php_mustache-*.zip
                  path: release-packages
                  merge-multiple: true

            - name: Validate complete release matrix and checksums
              run: python .github/scripts/binary_release.py validate release-packages "$PACKAGE_REF"

    release:
        name: Release binaries
        if: github.event_name == 'push' && ((github.ref_type == 'branch' && (github.ref_name == 'release' || startsWith(github.ref_name, 'release/'))) || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))
        needs: [binary-metadata, binary-validation, linux, docker, docker-fedora, osx, windows, macos-binaries, pie, nix, coveralls-finished]
        uses: ./.github/workflows/release.yml
        with:
            package-ref: ${{ needs.binary-metadata.outputs.package-ref }}
        secrets:
            RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        permissions:
            contents: write

    coveralls-finished:
        if: always() && !cancelled()
        needs:
            - linux
            - nix
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Finish Coveralls build
              uses: coverallsapp/github-action@v2
              with:
                  parallel-finished: true
